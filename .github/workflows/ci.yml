name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint (ruff, scope in ruff.toml)
        run: ruff check .
      - name: scaffold smoke test
        run: python tests/test_smoke.py
      - name: Learn unit tests
        run: python -m unittest tests.test_learn_serving -v
      - name: Learn runner
        run: python level-1-learn/run_learn.py
      - name: Build unit tests
        run: python -m unittest tests.test_build_serving -v
      - name: Build runner (fake backend, mechanics only)
        run: python level-2-build/run_build.py
      - name: Deep unit tests
        run: python -m unittest tests.test_deep_quant -v
      - name: Deep runner (fake backend, mechanics only)
        run: python level-3-deep/run_deep.py
