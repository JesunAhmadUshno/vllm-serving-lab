name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint (ruff, scope in ruff.toml)
        run: ruff check .
      - name: unit tests and layout test
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Learn runner
        run: python level-1-learn/run_learn.py
      - name: Build runner (fake backend, mechanics only)
        run: python level-2-build/run_build.py
      - name: Deep runner (fake backend, mechanics only)
        run: python level-3-deep/run_deep.py
      - name: Significance from the recorded GPU rows (Wilson, exact McNemar)
        run: python level-3-deep/significance.py
      - name: committed results match a fresh run
        run: git diff --exit-code -- level-1-learn/results_learn.json level-2-build/results_build.json level-3-deep/results_deep.json level-3-deep/results_significance.json
