name: Pages

# Builds the live dashboard in site/ from the committed level-*/ result files, README.md (verdict) and
# REPORT.md (v1.1 backlog), and publishes it to GitHub Pages at the repo root
# (https://jesunahmadushno.github.io/vllm-serving-lab/). It replaced the legacy Jekyll page from docs/index.md,
# removed on 2026-11-08 (its numbers are in REPORT.md). Requires the Pages source to be set to "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['site/**', 'level-*/**', 'README.md', 'REPORT.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
